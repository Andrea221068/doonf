<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doonf — bandiere da colorare</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site">
    <p class="name">Doonf</p>
    <h1>Bandiere da stampare e colorare</h1>
  </header>

  <main>
    <article class="sheet">
      <h2>Italia</h2>
      <svg class="flag" viewBox="0 0 300 200" role="img" aria-label="Bandiera dell'Italia da colorare">
        <rect x="8" y="8" width="284" height="184" rx="4"></rect>
        <line x1="102.7" y1="8" x2="102.7" y2="192"></line>
        <line x1="197.3" y1="8" x2="197.3" y2="192"></line>
      </svg>
      <p class="hint">Colora le tre parti: verde, bianco e rosso.</p>
      <button type="button" class="print" onclick="window.print()">Stampa</button>
    </article>
  </main>
</body>
</html>
